name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # 1. ЗАПУСК ОСНОВНОГО ПАЙПЛАЙНА
      - name: Run main pipeline
        run: |
          echo "Запуск основного пайплайна"
          python3 src/main_pipeline.py 
          echo "Пайплайн выполнен успешно!"

      # 2. ЗАПУСК ТЕСТОВ
      - name: Run tests
        run: |
          echo "Запуск тестов"
          pytest tests/ -v --cov=src
          echo "Тесты пройдены!"
      # 3. Сборка докер-образа
      - name: Build Docker image
        run: |
          docker build -t ml-model:latest .
      # 4. Сохранение образа
      - name: Save image to tar
        run: |
          docker save ml-model:latest -o ml-model.tar
      # 5. Выгрузка из github-actions  
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ml-model.tar